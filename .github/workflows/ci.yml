name: CalcMarkup CI Pipeline

on:
  push:
    branches:
      - main
      - limpeza-e-integracao
  pull_request:
    branches:
      - main
      - limpeza-e-integracao

jobs:
  unit-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install API Dependencies
        working-directory: mkp-professor/api
        run: npm ci

      - name: Run Jest API Unit Tests
        working-directory: mkp-professor/api
        run: npm test

  e2e-tests:
    name: Frontend E2E Functional Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install API Dependencies
        working-directory: mkp-professor/api
        run: npm ci

      - name: Install App Dependencies
        working-directory: mkp-professor/app
        run: npm ci

      - name: Install E2E Dependencies
        working-directory: mkp-professor/e2e-tests
        run: npm ci

      - name: Start API Server
        working-directory: mkp-professor/api
        run: npm start &
        env:
          PORT: 3001

      - name: Start App Server
        working-directory: mkp-professor/app
        run: npm start &
        env:
          PORT: 3000
          API_URL: http://localhost:3001

      - name: Wait for servers to be ready
        run: |
          npx wait-on http://localhost:3001/health
          npx wait-on http://localhost:3000/MKP

      - name: Run Selenium Functional E2E Tests
        working-directory: mkp-professor/e2e-tests
        run: npm test
        env:
          APP_URL: http://localhost:3000
          API_URL: http://localhost:3001

      - name: Upload Test Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-screenshots
          path: mkp-professor/e2e-tests/screenshots/*.png
